[project]
name = "garleb-desk"
version = "0.1.0"
description = "Morning trade intelligence desk for GARLEB — pasta, semolina and tomato lanes into the Levant, Gulf and East Africa."
authors = [{ name = "Norfront" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.156.3",
    "hijri-converter>=2.3.2.post1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
garleb-desk = "garleb_desk.main:serve"
garleb-refresh = "garleb_desk.connectors.refresh:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
